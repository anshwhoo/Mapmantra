// CONFLICTS — contradictions between regulations, reviewed by Legal
// ════════════════════════════════════════════════════════════════════
const CONFLICT_STEPS = [
  { key: 'review', label: 'Needs review', color: 'var(--red)', hint: 'Two regulations ask for things that cannot both be done. A manager assigns them to Legal.' },
  { key: 'legal', label: 'With Legal', color: 'var(--amber)', hint: 'Legal decides how the bank will comply with both regulators.' },
  { key: 'resolved', label: 'Resolved', color: 'var(--green)', hint: 'Legal has decided. Both actions are back with departments.' },
  { key: 'auto', label: 'Handled automatically', color: 'var(--cyan)', hint: 'Overlapping actions merged and outdated rules replaced by the system.' },
];

const conflictStage = c => c.resolution === 'resolved' ? 'resolved' : c.legal_assigned_at ? 'legal' : 'review';

function ConflictsScreen({ navigate }) {
  const { data: conflicts, loading, refetch } = usePolling('/api/conflicts', 15000);
  const [tab, setTab] = useState(null);
  const [busy, setBusy] = useState(null);
  const [confirming, setConfirming] = useState(null);
  const [error, setError] = useState('');

  const all = conflicts || [];
  const contradictions = all.filter(c => (c.conflict_type || 'B') === 'B');
  const groups = {
    review: contradictions.filter(c => conflictStage(c) === 'review'),
    legal: contradictions.filter(c => conflictStage(c) === 'legal'),
    resolved: contradictions.filter(c => conflictStage(c) === 'resolved'),
    auto: all.filter(c => (c.conflict_type || 'B') !== 'B'),
  };
  const current = tab || (groups.review.length ? 'review' : groups.legal.length ? 'legal' : 'resolved');
  const step = CONFLICT_STEPS.find(s => s.key === current);

  const post = async (url, id) => {
    setBusy(id);
    setError('');
    try {
      const r = await fetch(url, { method: 'POST' });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) setError(body.detail || 'That did not work. Please try again.');
    } catch {
      setError('Could not reach the server. Please try again.');
    }
    setBusy(null);
    setConfirming(null);
    refetch();
  };

  return (
    <div className="animate-in">
      <div className="mb-4">
        <h1 className="page-title">Conflicts</h1>
        <div className="text-sm mt-1" style={{ color: 'var(--text-2)' }}>
          When two regulations ask for things that cannot both be done, the affected actions are put on hold until Legal decides how to comply.
        </div>
      </div>

      <div className="step-tabs mb-4">
        {CONFLICT_STEPS.map((s, i) => (
          <button key={s.key} className={`step-tab ${current === s.key ? 'active' : ''}`} onClick={() => setTab(s.key)}
            style={current === s.key ? { borderColor: s.color } : null}>
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold" style={{ color: s.color }}>{i < 3 ? `STEP ${i + 1}` : 'SYSTEM'}</span>
              <span style={{ fontSize: 20, fontWeight: 800, color: groups[s.key].length ? s.color : 'var(--text-3)' }}>{groups[s.key].length}</span>
            </div>
            <div className="text-sm font-bold mt-1">{s.label}</div>
          </button>
        ))}
      </div>

      <div className="text-sm mb-3" style={{ color: 'var(--text-2)' }}>{step.hint}</div>
      {error && <div className="conflict-banner mb-4 text-sm">{error}</div>}

      {loading && !conflicts ? <div className="flex items-center gap-2"><div className="spinner" /> Loading...</div> : (
        <div>
          {current === 'auto'
            ? groups.auto.map(c => <AutoConflictRow key={c.id} c={c} navigate={navigate} />)
            : groups[current].map(c => (
                <ConflictCard key={c.id} c={c} navigate={navigate} busy={busy === c.id} confirming={confirming === c.id}
                  onAssign={() => post(`/api/conflicts/${c.id}/assign-legal`, c.id)}
                  onAskResolve={() => setConfirming(c.id)} onCancel={() => setConfirming(null)}
                  onResolve={() => post(`/api/conflicts/${c.id}/resolve`, c.id)} />
              ))}
          {groups[current].length === 0 && (
            <div className="text-sm" style={{ color: 'var(--text-2)', textAlign: 'center', padding: 40 }}>Nothing here right now.</div>
          )}
        </div>
      )}
    </div>
  );
}

function RulePanel({ n, source, regulation, dept, deadline, status, action, onOpen }) {
  const st = actionState({ status, deadline_date: deadline });
  return (
    <div className="rule-panel">
      <div className="flex justify-between items-center gap-2 flex-wrap">
        <span className="text-xs font-bold" style={{ color: 'var(--text-2)' }}>RULE {n}</span>
        {source && <Badge label={source} color="var(--purple)" />}
      </div>
      <div className="text-xs mt-1" style={{ color: 'var(--text-2)' }}>{regulation || 'Unknown circular'}</div>
      <div className="text-sm font-bold mt-2" style={{ lineHeight: 1.5 }}>{action}</div>
      <div className="text-xs mt-2" style={{ color: 'var(--text-2)' }}>
        {dept || 'Unassigned'}{DOT}Deadline {fmtDate(deadline)}{DOT}<span style={{ color: st.tone }}>{st.label}</span>
      </div>
      <button className="link-btn mt-2" onClick={onOpen}>Open action {'›'}</button>
    </div>
  );
}

function ConflictCard({ c, navigate, busy, confirming, onAssign, onAskResolve, onCancel, onResolve }) {
  const stage = conflictStage(c);
  const [why, suggestion] = (c.description || '').split(' | ');
  const timeline = [
    { label: 'Detected', date: c.created_at, done: true },
    { label: 'Assigned to Legal', date: c.legal_assigned_at, done: !!c.legal_assigned_at },
    { label: 'Resolved', date: c.resolved_at, done: stage === 'resolved' },
  ];
  return (
    <GlassCard className="mb-3" style={{ padding: '18px 20px' }}>
      <div className="timeline mb-3">
        {timeline.map((t, i) => (
          <div key={t.label} className={`timeline-step ${t.done ? 'done' : ''}`}>
            <span className="timeline-dot">{t.done ? '✓' : i + 1}</span>
            <span>
              <span className="text-xs font-bold">{t.label}</span>
              <span className="text-xs" style={{ color: 'var(--text-2)', display: 'block' }}>{t.done && t.date ? fmtDate(t.date) : 'Not yet'}</span>
            </span>
          </div>
        ))}
      </div>

      <div className="text-xs font-bold" style={{ color: 'var(--text-2)' }}>WHY THEY CONFLICT</div>
      <div className="text-sm mt-1" style={{ lineHeight: 1.55 }}>{why || 'These two requirements cannot both be satisfied.'}</div>
      {suggestion && (
        <>
          <div className="text-xs font-bold mt-3" style={{ color: 'var(--text-2)' }}>SUGGESTED APPROACH</div>
          <div className="text-sm mt-1" style={{ lineHeight: 1.55 }}>{suggestion}</div>
        </>
      )}

      <div className="rule-grid mt-4">
        <RulePanel n={1} source={c.map_1_source} regulation={c.map_1_regulation} dept={c.map_1_dept} deadline={c.map_1_deadline}
          status={c.map_1_status} action={c.map_1_action} onOpen={() => navigate('maps', { mapId: c.map_id_1 })} />
        <RulePanel n={2} source={c.map_2_source} regulation={c.map_2_regulation} dept={c.map_2_dept} deadline={c.map_2_deadline}
          status={c.map_2_status} action={c.map_2_action} onOpen={() => navigate('maps', { mapId: c.map_id_2 })} />
      </div>

      <div className="next-step mt-4">
        {stage === 'review' && (
          <>
            <div className="text-sm" style={{ lineHeight: 1.5 }}>
              <strong>Next step:</strong> assign this to Legal. Both actions stay on hold, so no department can submit evidence for them yet.
            </div>
            <button className="btn btn-primary" disabled={busy} onClick={onAssign}>{busy ? 'Assigning...' : 'Assign to Legal'}</button>
          </>
        )}
        {stage === 'legal' && !confirming && (
          <>
            <div className="text-sm" style={{ lineHeight: 1.5 }}>
              <strong>Next step:</strong> once Legal has agreed how the bank will comply, mark this resolved. Both actions are then re-assigned to departments and become active again.
            </div>
            <button className="btn btn-primary" onClick={onAskResolve}>Mark as resolved</button>
          </>
        )}
        {stage === 'legal' && confirming && (
          <>
            <div className="text-sm" style={{ lineHeight: 1.5, color: 'var(--amber)' }}>
              Confirm Legal has agreed the approach. Both actions will leave hold and be re-assigned to departments.
            </div>
            <div className="flex gap-2">
              <button className="btn btn-outline" onClick={onCancel} disabled={busy}>Cancel</button>
              <button className="btn btn-primary" onClick={onResolve} disabled={busy}>{busy ? 'Resolving...' : 'Yes, resolve'}</button>
            </div>
          </>
        )}
        {stage === 'resolved' && (
          <div className="text-sm" style={{ lineHeight: 1.5, color: 'var(--green)' }}>
            Resolved on {fmtDate(c.resolved_at)}. Both actions are active again; open them above to submit evidence.
          </div>
        )}
      </div>
    </GlassCard>
  );
}

function AutoConflictRow({ c, navigate }) {
  const merged = c.conflict_type === 'C';
  return (
    <GlassCard className="mb-2" style={{ padding: '14px 18px' }}>
      <div className="flex justify-between items-center gap-2 flex-wrap mb-2">
        <Badge label={merged ? 'Merged: overlapping actions' : 'Replaced: newer rule'} color={merged ? 'var(--cyan)' : 'var(--text-2)'} />
        <span className="text-xs" style={{ color: 'var(--text-2)' }}>{fmtDate(c.resolved_at || c.created_at)}</span>
      </div>
      <div className="text-sm" style={{ lineHeight: 1.5 }}>{(c.description || '').split(' | ')[0] || 'Handled automatically.'}</div>
      <div className="text-xs mt-2" style={{ color: 'var(--text-2)', lineHeight: 1.5 }}>
        {c.map_1_source || '?'}: {c.map_1_action}<br />{c.map_2_source || '?'}: {c.map_2_action}
      </div>
    </GlassCard>
  );
}

function ThreatIntelScreen({ navigate }) {
  const { data, loading } = useApi('/api/threat-intel');

  const computed = useMemo(() => {
    if (!data || !data.techniques) return { mappedCount: 0, avgCoverage: 0 };
    const mappedMaps = new Set();
    data.techniques.forEach(t => (t.maps || []).forEach(m => mappedMaps.add(m.id)));
    
    const avgCoverage = data.techniques.length 
      ? Math.round((data.techniques.reduce((acc, t) => acc + (t.coverage || 0), 0) / data.techniques.length) * 100)
      : 0;

    return {
      mappedCount: mappedMaps.size,
      avgCoverage
    };
  }, [data]);

  return (
    <div className="animate-in">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h1 className="page-title">Threat Intelligence</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-3)' }}>MITRE ATT&CK mapping for compliance actions</div>
        </div>
      </div>

      {loading || !data ? <div className="flex items-center gap-2"><div className="spinner" /> Loading...</div> : (
        <div>
          <div className="metrics-row mb-4">
            <GlassCard className="metric-card">
              <div className="metric-label">Total MAPs Mapped</div>
              <div className="metric-value" style={{ color: 'var(--cyan)' }}>{computed.mappedCount}</div>
            </GlassCard>
            <GlassCard className="metric-card">
              <div className="metric-label">Unique Techniques</div>
              <div className="metric-value" style={{ color: 'var(--purple)' }}>{data.total_techniques || 0}</div>
            </GlassCard>
            <GlassCard className="metric-card">
              <div className="metric-label">Average Coverage</div>
              <div className="metric-value" style={{ color: 'var(--green)' }}>{computed.avgCoverage}%</div>
            </GlassCard>
            <GlassCard className="metric-card">
              <div className="metric-label">Unmitigated Techniques</div>
              <div className="metric-value" style={{ color: 'var(--amber)' }}>{data.unmitigated_count || 0}</div>
            </GlassCard>
          </div>

          {(data.techniques || []).map((t, i) => (
            <GlassCard key={i} className="mb-2" style={{ padding: '14px 18px' }}>
              <div className="flex justify-between items-center">
                <div>
                  <span className="attack-tag" style={{ marginRight: 8 }}>{t.technique_id}</span>
                  <span className="font-bold text-sm">{ATTACK_NAMES[t.technique_id] || "Defensive Capability"}</span>
                </div>
                <Badge label={`${t.maps ? t.maps.length : 0} MAPs`} color="var(--cyan)" />
              </div>
            </GlassCard>
          ))}
        </div>
      )}
    </div>
  );
}

function LegacyAuditTrailScreen() {
  const { data, loading, refetch } = usePolling('/api/audit/logs?limit=100', 30000);
  const [agentFilter, setAgentFilter] = useState('all');

  const filtered = useMemo(() => {
    if (!data) return [];
    if (agentFilter === 'all') return data;
    return data.filter(l => l.agent === agentFilter);
  }, [data, agentFilter]);

  const agents = useMemo(() => {
    if (!data) return ['all'];
    return ['all', ...new Set(data.map(l => l.agent).filter(Boolean))];
  }, [data]);

  return (
    <div className="animate-in">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h1 className="page-title">Audit Trail</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-3)' }}>Tamper-proof log of all agent actions</div>
        </div>
      </div>

      <div className="flex gap-2 mb-4 flex-wrap">
        {agents.map(a => (
          <button key={a} className={`tb-tab ${agentFilter === a ? 'active' : ''}`}
            style={{ fontSize: 11, padding: '5px 12px', borderRadius: 'var(--radius-pill)', border: '1px solid var(--glass-border)', background: agentFilter === a ? 'rgba(6,182,212,0.1)' : 'transparent' }}
            onClick={() => setAgentFilter(a)}>
            {a === 'all' ? 'All Agents' : a}
          </button>
        ))}
      </div>

      {loading && !data ? <div className="flex items-center gap-2"><div className="spinner" /> Loading...</div> : (
        <div>
          {filtered.map((l, i) => (
            <div key={i} style={{ display: 'flex', gap: 12, padding: '10px 0', borderBottom: '1px solid var(--glass-border)' }}>
              <div style={{ width: 3, borderRadius: 2, background: agentColor(l.agent), flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="flex gap-2 items-center">
                  <Badge label={l.agent} color={agentColor(l.agent)} />
                  <span className="text-xs" style={{ color: 'var(--text-3)' }}>{timeAgo(l.timestamp)}</span>
                </div>
                <div className="text-sm font-bold mt-1">{l.action}</div>
                {l.detail && <div className="text-xs mt-1 line-clamp-2" style={{ color: 'var(--text-3)' }}>{typeof l.detail === 'string' ? l.detail : JSON.stringify(l.detail).slice(0, 150)}</div>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// RISK REPORT SCREEN
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function AuditTrailScreen() {
  const { data, loading } = usePolling('/api/audit/logs?limit=150', 30000);
  const [agentFilter, setAgentFilter] = useState('all');
  const [search, setSearch] = useState('');
  const logs = data || [];
  const agents = useMemo(() => ['all', ...new Set(logs.map(l => l.agent).filter(Boolean))], [logs]);
  const filtered = useMemo(() => logs.filter(l => {
    const agentOk = agentFilter === 'all' || l.agent === agentFilter;
    const haystack = `${l.agent || ''} ${l.action || ''} ${l.detail || ''}`.toLowerCase();
    return agentOk && haystack.includes(search.toLowerCase());
  }), [logs, agentFilter, search]);
  const counts = useMemo(() => ({
    total: logs.length,
    router: logs.filter(l => l.agent === 'router').length,
    conflict: logs.filter(l => l.agent === 'conflict_detector').length,
    failed: logs.filter(l => String(l.action || '').toLowerCase().includes('fail')).length,
  }), [logs]);
  const formatDetail = (detail) => {
    if (!detail) return 'No details captured';
    try {
      const parsed = typeof detail === 'string' ? JSON.parse(detail) : detail;
      return Object.entries(parsed).slice(0, 4).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : String(v)}`).join(' | ');
    } catch {
      return String(detail);
    }
  };

  return (
    <div className="animate-in">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h1 className="page-title">Audit Trail</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-3)' }}>Agent activity, routing decisions, and compliance evidence in chronological order</div>
        </div>
      </div>
      <div className="metrics-row mb-4">
        <GlassCard className="metric-card"><div className="metric-label">Recent Events</div><div className="metric-value" style={{ color: 'var(--cyan)' }}>{counts.total}</div></GlassCard>
        <GlassCard className="metric-card"><div className="metric-label">Router Actions</div><div className="metric-value" style={{ color: 'var(--blue)' }}>{counts.router}</div></GlassCard>
        <GlassCard className="metric-card"><div className="metric-label">Conflict Checks</div><div className="metric-value" style={{ color: 'var(--red)' }}>{counts.conflict}</div></GlassCard>
        <GlassCard className="metric-card"><div className="metric-label">Failures</div><div className="metric-value" style={{ color: counts.failed ? 'var(--red)' : 'var(--green)' }}>{counts.failed}</div></GlassCard>
      </div>
      <GlassCard className="mb-4" style={{ padding: 14 }}>
        <div className="flex gap-2 flex-wrap items-center">
          <input placeholder="Search audit trail" value={search} onChange={e => setSearch(e.target.value)} style={{
            maxWidth: 260,
            width: '100%',
            padding: '8px 12px',
            borderRadius: 'var(--radius-sm)',
            border: '1px solid var(--glass-border)',
            background: 'rgba(255,255,255,0.04)',
            color: 'var(--text-1)',
            outline: 'none'
          }} />
          {agents.map(a => (
            <button key={a} className={`tb-tab ${agentFilter === a ? 'active' : ''}`}
              style={{ fontSize: 11, padding: '6px 12px', borderRadius: 'var(--radius-pill)', border: '1px solid var(--glass-border)', background: agentFilter === a ? 'rgba(6,182,212,0.12)' : 'transparent' }}
              onClick={() => setAgentFilter(a)}>
              {a === 'all' ? 'All Agents' : a.replace('_', ' ')}
            </button>
          ))}
        </div>
      </GlassCard>
      {loading && !data ? <div className="flex items-center gap-2"><div className="spinner" /> Loading...</div> : (
        <div>
          {filtered.map((l, i) => (
            <GlassCard key={l.id || i} className="mb-2" style={{ padding: '12px 16px', borderLeft: `3px solid ${agentColor(l.agent)}` }}>
              <div className="flex justify-between items-start gap-3">
                <div style={{ minWidth: 0 }}>
                  <div className="flex gap-2 items-center mb-1">
                    <Badge label={(l.agent || 'agent').replace('_', ' ')} color={agentColor(l.agent)} />
                    <span className="text-xs" style={{ color: 'var(--text-3)' }}>{timeAgo(l.timestamp)}</span>
                  </div>
                  <div className="text-sm font-bold">{l.action || 'Agent event'}</div>
                  <div className="text-xs mt-1 line-clamp-2" style={{ color: 'var(--text-3)' }}>{formatDetail(l.detail)}</div>
                </div>
                {(l.map_id || l.regulation_id) && (
                  <div className="text-xs" style={{ color: 'var(--text-4)', textAlign: 'right', minWidth: 150 }}>
                    {l.map_id && <div>MAP {String(l.map_id).slice(0, 8)}</div>}
                    {l.regulation_id && <div>REG {String(l.regulation_id).slice(0, 8)}</div>}
                  </div>
                )}
              </div>
            </GlassCard>
          ))}
          {filtered.length === 0 && <div className="text-sm" style={{ color: 'var(--text-3)', textAlign: 'center', padding: 40 }}>No audit events match the current filters.</div>}
        </div>
      )}
    </div>
  );
}

function RiskReportScreen() {
  const { data } = useApi('/api/risk-report');
  if (!data) return <div className="spinner mt-4" />;
  const score = data.global_score || 0;
  const fin = data.financial_exposure || {};
  const bd = data.breakdown || {};
  const departments = data.departments || {};

  const rows = [
    { label: 'High Priority Overdue', count: bd.overdue_high || 0, mult: 12, positive: true },
    { label: 'Medium Priority Overdue', count: bd.overdue_medium || 0, mult: 6, positive: true },
    { label: 'Low Priority Overdue', count: bd.overdue_low || 0, mult: 3, positive: true },
    { label: 'Unresolved Conflicts', count: bd.conflicts_unresolved || 0, mult: 8, positive: true },
    { label: 'Pending High Priority', count: bd.pending_high || 0, mult: 3, positive: true },
    { label: 'Completed This Month', count: bd.completed_this_month || 0, mult: -2, positive: false }
  ];

  return (
    <div className="animate-in">
      <div className="flex justify-between items-center mb-6">
        <div>
          <h1 className="page-title">Executive Risk Report</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-3)' }}>Real-time compliance exposure and risk scoring</div>
        </div>
      </div>
      <div className="grid-3 mb-4">
        <GlassCard style={{ textAlign:'center', borderColor: score>=60?'rgba(239,68,68,0.2)':'transparent', boxShadow: score>=60?'var(--glow-red)':'none' }}>
          <div className="metric-label">Overall Risk Score</div>
          <div className="metric-value" style={{ color: riskColor(score), fontSize: 48 }}>{score}</div>
          <div className="metric-desc">out of 100</div>
        </GlassCard>
        <GlassCard style={{ textAlign:'center' }}>
          <div className="metric-label">Penalty Exposure</div>
          <div style={{ fontSize:24, fontWeight:900, color:'var(--amber)', margin:'10px 0' }}>INR {fin.min_cr||0}Cr - INR {fin.max_cr||0}Cr</div>
          <div className="metric-desc">{fin.overdue_count||0} overdue MAPs contributing</div>
        </GlassCard>
        <GlassCard style={{ textAlign:'center' }}>
          <div className="metric-label">Closed This Month</div>
          <div className="metric-value" style={{ color:'var(--green)' }}>{bd.completed_this_month||0}</div>
          <div className="metric-desc">Score reduced by {(bd.completed_this_month||0)*2} points</div>
        </GlassCard>
      </div>

      <GlassCard className="mb-4">
        <div className="section-title">How this score is calculated</div>
        {rows.map((r,i) => {
          const pts = r.count * r.mult;
          const bg = r.positive && r.count > 0 ? 'rgba(239,68,68,0.05)' : !r.positive && r.count > 0 ? 'rgba(16,185,129,0.05)' : 'transparent';
          const ptColor = pts > 0 ? 'var(--red)' : pts < 0 ? 'var(--green)' : 'var(--text-4)';
          return <div key={i} className="flex items-center justify-between" style={{ background:bg, borderRadius:'var(--radius-sm)', padding:'10px 14px', margin:'2px 0' }}>
            <span className="text-sm">{r.label}</span>
            <div className="flex gap-4 items-center"><span className="text-sm" style={{color:'var(--text-3)'}}>{r.count} Ã-{r.mult}</span>
              <span className="font-bold" style={{color:ptColor,width:50,textAlign:'right'}}>{pts>0?'+':''}{pts}</span></div>
          </div>;
        })}
        <div className="flex items-center justify-between" style={{ borderTop:'2px solid var(--glass-border)', paddingTop:10, marginTop:4 }}>
          <span className="font-bold text-lg">Total (clamped 0-100)</span>
          <span style={{ fontSize:22, fontWeight:900, color:riskColor(score) }}>{score}</span>
        </div>
      </GlassCard>

      <div className="section-title">Risk by Department</div>
      <div className="grid-3 mb-4">
        {['IT','Compliance','Legal','HR','Risk','Operations'].map(name => {
          const d = departments[name] || {};
          return <GlassCard key={name} style={{ textAlign:'center' }}>
            <div className="text-sm font-bold mb-2">{name}</div>
            <div style={{fontSize:28,fontWeight:900,color:riskColor(d.score||0)}}>{d.score||0}</div>
            <div style={{margin:'10px auto',height:6,background:'rgba(255,255,255,0.04)',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${Math.min(d.score||0,100)}%`,background:riskColor(d.score||0),borderRadius:3,transition:'width 0.8s'}}/>
            </div>
            <div className="flex justify-between text-xs" style={{color:'var(--text-4)',gap:8,justifyContent:'center'}}>
              <span style={{color:'var(--red)'}}>Overdue {d.overdue||0}</span>
              <span style={{color:'var(--blue)'}}>Active {d.in_progress||0}</span>
              <span style={{color:'var(--green)'}}>Done {d.completed||0}</span>
            </div>
          </GlassCard>;
        })}
      </div>

      <div className="section-title">Estimated Regulatory Exposure</div>
      <div className="grid-2">
        <GlassCard style={{textAlign:'center'}}><div className="text-xs" style={{color:'var(--text-4)'}}>Minimum Exposure</div><div style={{fontSize:24,fontWeight:900,color:'var(--amber)',margin:'8px 0'}}>INR {fin.min_cr||0} Crores</div></GlassCard>
        <GlassCard style={{textAlign:'center'}}><div className="text-xs" style={{color:'var(--text-4)'}}>Maximum Exposure</div><div style={{fontSize:24,fontWeight:900,color:'var(--red)',margin:'8px 0'}}>INR {fin.max_cr||0} Crores</div></GlassCard>
      </div>
      <div className="text-xs mt-2" style={{color:'var(--text-4)',textAlign:'center'}}>Based on RBI (INR 2Cr-INR 50Cr), SEBI (INR 1Cr-INR 25Cr), and IRDAI (INR 50L-INR 5Cr) penalty ranges per overdue MAP.</div>
    </div>
  );
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// APP - Router + Layout
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function App() {
  const [page, setPage] = useState('dashboard');
  const { data: dashboard } = usePolling('/api/dashboard', 15000);
  const counts = { newRegs: dashboard?.new_circulars || 0, conflicts: dashboard?.conflicts || 0 };

  const [openMapId, setOpenMapId] = useState(null);
  const navigate = (p, opts = {}) => { setOpenMapId(opts.mapId || null); setPage(p); };

  const screens = {
    dashboard: <DashboardScreen dashboard={dashboard} navigate={navigate} />,
    inbox: <InboxScreen navigate={navigate} />,
    maps: <MapBoardScreen key={openMapId || 'board'} navigate={navigate} initialMapId={openMapId} />,
    map_detail: <MapDetailScreen navigate={navigate} />,
    conflicts: <ConflictsScreen navigate={navigate} />,
    threat: <ThreatIntelScreen navigate={navigate} />,
    audit: <AuditTrailScreen />,
    risk: <RiskReportScreen />,
  };

  const exportCSV = async () => {
    const maps = await api('/api/maps?limit=1000');
    if (!maps || !maps.length) { alert('No MAP data to export.'); return; }
    const headers = ['ID','Department','Action','Status','Priority','Deadline','Metric','Verification'];
    const rows = maps.map(m => [
      m.id,
      m.department || '',
      `"${(m.action_description||'').replace(/"/g,'""')}"`,
      m.status || '',
      m.priority || '',
      (m.deadline_date||'').slice(0,10),
      `"${(m.compliance_metric||'').replace(/"/g,'""')}"`,
      `"${(m.verification_method||'').replace(/"/g,'""')}"`
    ]);
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `mapmantra_maps_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const downloadReport = async () => {
    const [risk, maps, conflicts] = await Promise.all([
      api('/api/risk-report'),
      api('/api/maps?limit=1000'),
      api('/api/conflicts'),
    ]);
    const now = new Date().toISOString().slice(0,10);
    const total = maps ? maps.length : 0;
    const byStatus = {};
    (maps||[]).forEach(m => { byStatus[m.status] = (byStatus[m.status]||0)+1; });
    const byDept = {};
    (maps||[]).forEach(m => { byDept[m.department] = (byDept[m.department]||0)+1; });
    const lines = [
      `MAPMANTRA - COMPLIANCE STATUS REPORT`,
      `Generated: ${now}`,
      `${'='.repeat(60)}`,
      ``,
      `EXECUTIVE SUMMARY`,
      `-`.repeat(40),
      `Overall Risk Score : ${risk?.global_score || 'N/A'} / 100`,
      `Total MAPs         : ${total}`,
      `Completed          : ${byStatus['completed']||0}`,
      `In Progress        : ${byStatus['in_progress']||0}`,
      `Overdue            : ${byStatus['overdue']||0}`,
      `Partial            : ${byStatus['partial']||0}`,
      `Conflicts (Open)   : ${(conflicts||[]).filter(c=>c.resolution==='pending_legal').length}`,
      ``,
      `STATUS BREAKDOWN BY DEPARTMENT`,
      `-`.repeat(40),
      ...Object.entries(byDept).map(([d,c]) => `  ${d.padEnd(20)} ${c} MAPs`),
      ``,
      `FINANCIAL EXPOSURE`,
      `-`.repeat(40),
      `Minimum: INR ${risk?.financial_exposure?.min_cr||0} Crores`,
      `Maximum: INR ${risk?.financial_exposure?.max_cr||0} Crores`,
      ``,
      `${'='.repeat(60)}`,
      `This report was auto-generated by MapMantra AI Compliance System.`,
    ];
    const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `mapmantra_compliance_report_${now}.txt`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  return (
    <div className="app-layout">
      <Sidebar page={page} navigate={navigate} counts={counts} />
      <Topbar page={page} navigate={navigate} dashboard={dashboard} onExportCSV={exportCSV} onDownloadReport={downloadReport} />
      <main className="main-area">
        {screens[page] || screens.dashboard}
      </main>
    </div>
  );
}
