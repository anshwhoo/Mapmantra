// RISK REPORT SCREEN
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function AuditTrailScreen() {
  const { data, loading } = usePolling('/api/audit/logs?limit=150', 30000);
  const [agentFilter, setAgentFilter] = useState('all');
  const [search, setSearch] = useState('');
  const logs = data || [];
  const agents = useMemo(() => ['all', ...new Set(logs.map(l => l.agent).filter(Boolean))], [logs]);
  const filtered = useMemo(() => logs.filter(l => {
    const agentOk = agentFilter === 'all' || l.agent === agentFilter;
    const haystack = `${l.agent || ''} ${l.action || ''} ${l.detail || ''}`.toLowerCase();
    return agentOk && haystack.includes(search.toLowerCase());
  }), [logs, agentFilter, search]);
  const counts = useMemo(() => ({
    total: logs.length,
    router: logs.filter(l => l.agent === 'router').length,
    conflict: logs.filter(l => l.agent === 'conflict_detector').length,
    failed: logs.filter(l => String(l.action || '').toLowerCase().includes('fail')).length,
  }), [logs]);
  const formatDetail = (detail) => {
    if (!detail) return 'No details captured';
    try {
      const parsed = typeof detail === 'string' ? JSON.parse(detail) : detail;
      return Object.entries(parsed).slice(0, 4).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : String(v)}`).join(' | ');
    } catch {
      return String(detail);
    }
  };

  return (
    <div className="animate-in">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h1 className="page-title">Audit Trail</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-3)' }}>Agent activity, routing decisions, and compliance evidence in chronological order</div>
        </div>
      </div>
      <div className="metrics-row mb-4">
        <GlassCard className="metric-card"><div className="metric-label">Recent Events</div><div className="metric-value" style={{ color: 'var(--cyan)' }}>{counts.total}</div></GlassCard>
        <GlassCard className="metric-card"><div className="metric-label">Router Actions</div><div className="metric-value" style={{ color: 'var(--blue)' }}>{counts.router}</div></GlassCard>
        <GlassCard className="metric-card"><div className="metric-label">Conflict Checks</div><div className="metric-value" style={{ color: 'var(--red)' }}>{counts.conflict}</div></GlassCard>
        <GlassCard className="metric-card"><div className="metric-label">Failures</div><div className="metric-value" style={{ color: counts.failed ? 'var(--red)' : 'var(--green)' }}>{counts.failed}</div></GlassCard>
      </div>
      <GlassCard className="mb-4" style={{ padding: 14 }}>
        <div className="flex gap-2 flex-wrap items-center">
          <input placeholder="Search audit trail" value={search} onChange={e => setSearch(e.target.value)} style={{
            maxWidth: 260,
            width: '100%',
            padding: '8px 12px',
            borderRadius: 'var(--radius-sm)',
            border: '1px solid var(--glass-border)',
            background: 'rgba(255,255,255,0.04)',
            color: 'var(--text-1)',
            outline: 'none'
          }} />
          {agents.map(a => (
            <button key={a} className={`tb-tab ${agentFilter === a ? 'active' : ''}`}
              style={{ fontSize: 11, padding: '6px 12px', borderRadius: 'var(--radius-pill)', border: '1px solid var(--glass-border)', background: agentFilter === a ? 'rgba(6,182,212,0.12)' : 'transparent' }}
              onClick={() => setAgentFilter(a)}>
              {a === 'all' ? 'All Agents' : a.replace('_', ' ')}
            </button>
          ))}
        </div>
      </GlassCard>
      {loading && !data ? <div className="flex items-center gap-2"><div className="spinner" /> Loading...</div> : (
        <div>
          {filtered.map((l, i) => (
            <GlassCard key={l.id || i} className="mb-2" style={{ padding: '12px 16px', borderLeft: `3px solid ${agentColor(l.agent)}` }}>
              <div className="flex justify-between items-start gap-3">
                <div style={{ minWidth: 0 }}>
                  <div className="flex gap-2 items-center mb-1">
                    <Badge label={(l.agent || 'agent').replace('_', ' ')} color={agentColor(l.agent)} />
                    <span className="text-xs" style={{ color: 'var(--text-3)' }}>{timeAgo(l.timestamp)}</span>
                  </div>
                  <div className="text-sm font-bold">{l.action || 'Agent event'}</div>
                  <div className="text-xs mt-1 line-clamp-2" style={{ color: 'var(--text-3)' }}>{formatDetail(l.detail)}</div>
                </div>
                {(l.map_id || l.regulation_id) && (
                  <div className="text-xs" style={{ color: 'var(--text-4)', textAlign: 'right', minWidth: 150 }}>
                    {l.map_id && <div>MAP {String(l.map_id).slice(0, 8)}</div>}
                    {l.regulation_id && <div>REG {String(l.regulation_id).slice(0, 8)}</div>}
                  </div>
                )}
              </div>
            </GlassCard>
          ))}
          {filtered.length === 0 && <div className="text-sm" style={{ color: 'var(--text-3)', textAlign: 'center', padding: 40 }}>No audit events match the current filters.</div>}
        </div>
      )}
    </div>
  );
}

function RiskReportScreen() {
  const { data } = useApi('/api/risk-report');
  if (!data) return <div className="spinner mt-4" />;
  const score = data.global_score || 0;
  const fin = data.financial_exposure || {};
  const bd = data.breakdown || {};
  const departments = data.departments || {};

  const rows = [
    { label: 'High Priority Overdue', count: bd.overdue_high || 0, mult: 12, positive: true },
    { label: 'Medium Priority Overdue', count: bd.overdue_medium || 0, mult: 6, positive: true },
    { label: 'Low Priority Overdue', count: bd.overdue_low || 0, mult: 3, positive: true },
    { label: 'Unresolved Conflicts', count: bd.conflicts_unresolved || 0, mult: 8, positive: true },
    { label: 'Pending High Priority', count: bd.pending_high || 0, mult: 3, positive: true },
    { label: 'Completed This Month', count: bd.completed_this_month || 0, mult: -2, positive: false }
  ];

  return (
    <div className="animate-in">
      <div className="flex justify-between items-center mb-6">
        <div>
          <h1 className="page-title">Executive Risk Report</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-3)' }}>Real-time compliance exposure and risk scoring</div>
        </div>
      </div>
      <div className="grid-3 mb-4">
        <GlassCard style={{ textAlign:'center', borderColor: score>=60?'rgba(239,68,68,0.2)':'transparent', boxShadow: score>=60?'var(--glow-red)':'none' }}>
          <div className="metric-label">Overall Risk Score</div>
          <div className="metric-value" style={{ color: riskColor(score), fontSize: 48 }}>{score}</div>
          <div className="metric-desc">out of 100</div>
        </GlassCard>
        <GlassCard style={{ textAlign:'center' }}>
          <div className="metric-label">Penalty Exposure</div>
          <div style={{ fontSize:24, fontWeight:900, color:'var(--amber)', margin:'10px 0' }}>INR {fin.min_cr||0}Cr - INR {fin.max_cr||0}Cr</div>
          <div className="metric-desc">{fin.overdue_count||0} overdue MAPs contributing</div>
        </GlassCard>
        <GlassCard style={{ textAlign:'center' }}>
          <div className="metric-label">Closed This Month</div>
          <div className="metric-value" style={{ color:'var(--green)' }}>{bd.completed_this_month||0}</div>
          <div className="metric-desc">Score reduced by {(bd.completed_this_month||0)*2} points</div>
        </GlassCard>
      </div>

      <GlassCard className="mb-4">
        <div className="section-title">How this score is calculated</div>
        {rows.map((r,i) => {
          const pts = r.count * r.mult;
          const bg = r.positive && r.count > 0 ? 'rgba(239,68,68,0.05)' : !r.positive && r.count > 0 ? 'rgba(16,185,129,0.05)' : 'transparent';
          const ptColor = pts > 0 ? 'var(--red)' : pts < 0 ? 'var(--green)' : 'var(--text-4)';
          return <div key={i} className="flex items-center justify-between" style={{ background:bg, borderRadius:'var(--radius-sm)', padding:'10px 14px', margin:'2px 0' }}>
            <span className="text-sm">{r.label}</span>
            <div className="flex gap-4 items-center"><span className="text-sm" style={{color:'var(--text-3)'}}>{r.count} Ã-{r.mult}</span>
              <span className="font-bold" style={{color:ptColor,width:50,textAlign:'right'}}>{pts>0?'+':''}{pts}</span></div>
          </div>;
        })}
        <div className="flex items-center justify-between" style={{ borderTop:'2px solid var(--glass-border)', paddingTop:10, marginTop:4 }}>
          <span className="font-bold text-lg">Total (clamped 0-100)</span>
          <span style={{ fontSize:22, fontWeight:900, color:riskColor(score) }}>{score}</span>
        </div>
      </GlassCard>

      <div className="section-title">Risk by Department</div>
      <div className="grid-3 mb-4">
        {['IT','Compliance','Legal','HR','Risk','Operations'].map(name => {
          const d = departments[name] || {};
          return <GlassCard key={name} style={{ textAlign:'center' }}>
            <div className="text-sm font-bold mb-2">{name}</div>
            <div style={{fontSize:28,fontWeight:900,color:riskColor(d.score||0)}}>{d.score||0}</div>
            <div style={{margin:'10px auto',height:6,background:'rgba(255,255,255,0.04)',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${Math.min(d.score||0,100)}%`,background:riskColor(d.score||0),borderRadius:3,transition:'width 0.8s'}}/>
            </div>
            <div className="flex justify-between text-xs" style={{color:'var(--text-4)',gap:8,justifyContent:'center'}}>
              <span style={{color:'var(--red)'}}>Overdue {d.overdue||0}</span>
              <span style={{color:'var(--blue)'}}>Active {d.in_progress||0}</span>
              <span style={{color:'var(--green)'}}>Done {d.completed||0}</span>
            </div>
          </GlassCard>;
        })}
      </div>

      <div className="section-title">Estimated Regulatory Exposure</div>
      <div className="grid-2">
        <GlassCard style={{textAlign:'center'}}><div className="text-xs" style={{color:'var(--text-4)'}}>Minimum Exposure</div><div style={{fontSize:24,fontWeight:900,color:'var(--amber)',margin:'8px 0'}}>INR {fin.min_cr||0} Crores</div></GlassCard>
        <GlassCard style={{textAlign:'center'}}><div className="text-xs" style={{color:'var(--text-4)'}}>Maximum Exposure</div><div style={{fontSize:24,fontWeight:900,color:'var(--red)',margin:'8px 0'}}>INR {fin.max_cr||0} Crores</div></GlassCard>
      </div>
      <div className="text-xs mt-2" style={{color:'var(--text-4)',textAlign:'center'}}>Based on RBI (INR 2Cr-INR 50Cr), SEBI (INR 1Cr-INR 25Cr), and IRDAI (INR 50L-INR 5Cr) penalty ranges per overdue MAP.</div>
    </div>
  );
}

// APP - Router + Layout
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function App() {
  const [page, setPage] = useState('dashboard');
  const { data: dashboard } = usePolling('/api/dashboard', 15000);
  const counts = { newRegs: dashboard?.new_circulars || 0, conflicts: dashboard?.conflicts || 0 };

  const navigate = (p) => setPage(p);

  const screens = {
    dashboard: <DashboardScreen dashboard={dashboard} navigate={navigate} />,
    inbox: <InboxScreen navigate={navigate} />,
    maps: <MapBoardScreen navigate={navigate} />,
    map_detail: <MapDetailScreen navigate={navigate} />,
    conflicts: <ConflictsScreen />,
    threat: <ThreatIntelScreen navigate={navigate} />,
    audit: <AuditTrailScreen />,
    risk: <RiskReportScreen />,
  };

  const exportCSV = async () => {
    const maps = await api('/api/maps?limit=1000');
    if (!maps || !maps.length) { alert('No MAP data to export.'); return; }
    const headers = ['ID','Department','Action','Status','Priority','Deadline','Metric','Verification'];
    const rows = maps.map(m => [
      m.id,
      m.department || '',
      `"${(m.action_description||'').replace(/"/g,'""')}"`,
      m.status || '',
      m.priority || '',
      (m.deadline_date||'').slice(0,10),
      `"${(m.compliance_metric||'').replace(/"/g,'""')}"`,
      `"${(m.verification_method||'').replace(/"/g,'""')}"`
    ]);
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `mapmantra_maps_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const downloadReport = async () => {
    const [risk, maps, conflicts] = await Promise.all([
      api('/api/risk-report'),
      api('/api/maps?limit=1000'),
      api('/api/conflicts'),
    ]);
    const now = new Date().toISOString().slice(0,10);
    const total = maps ? maps.length : 0;
    const byStatus = {};
    (maps||[]).forEach(m => { byStatus[m.status] = (byStatus[m.status]||0)+1; });
    const byDept = {};
    (maps||[]).forEach(m => { byDept[m.department] = (byDept[m.department]||0)+1; });
    const lines = [
      `MAPMANTRA - COMPLIANCE STATUS REPORT`,
      `Generated: ${now}`,
      `${'='.repeat(60)}`,
      ``,
      `EXECUTIVE SUMMARY`,
      `-`.repeat(40),
      `Overall Risk Score : ${risk?.global_score || 'N/A'} / 100`,
      `Total MAPs         : ${total}`,
      `Completed          : ${byStatus['completed']||0}`,
      `In Progress        : ${byStatus['in_progress']||0}`,
      `Overdue            : ${byStatus['overdue']||0}`,
      `Partial            : ${byStatus['partial']||0}`,
      `Conflicts (Open)   : ${(conflicts||[]).filter(c=>c.resolution==='pending_legal').length}`,
      ``,
      `STATUS BREAKDOWN BY DEPARTMENT`,
      `-`.repeat(40),
      ...Object.entries(byDept).map(([d,c]) => `  ${d.padEnd(20)} ${c} MAPs`),
      ``,
      `FINANCIAL EXPOSURE`,
      `-`.repeat(40),
      `Minimum: INR ${risk?.financial_exposure?.min_cr||0} Crores`,
      `Maximum: INR ${risk?.financial_exposure?.max_cr||0} Crores`,
      ``,
      `${'='.repeat(60)}`,
      `This report was auto-generated by MapMantra AI Compliance System.`,
    ];
    const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `mapmantra_compliance_report_${now}.txt`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  return (
    <div className="app-layout">
      <Sidebar page={page} navigate={navigate} counts={counts} />
      <Topbar page={page} navigate={navigate} dashboard={dashboard} onExportCSV={exportCSV} onDownloadReport={downloadReport} />
      <main className="main-area">
        {screens[page] || screens.dashboard}
      </main>
    </div>
  );
}
